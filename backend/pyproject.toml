[project]
name = "policypal-backend"
version = "0.1.0"
description = "PolicyPal — multi-tenant RAG chatbot over HR policy documents"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # LLM
    "groq>=0.9.0",
    # Embeddings
    "sentence-transformers>=3.0.0",
    "langchain-huggingface>=0.0.3",
    "langchain-community>=0.2.0",
    "langchain>=0.2.0",
    # Vector store
    "qdrant-client>=1.9.0",
    # Database (Neon PostgreSQL)
    "psycopg2-binary>=2.9.9",
    # Document parsing
    "pypdf>=4.2.0",
    # Env
    "python-dotenv>=1.0.0",
    # File uploads
    "python-multipart>=0.0.9",
]

[tool.uv]
dev-dependencies = [
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
